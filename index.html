<!doctype html>
<html lang="es-CL" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Code4SQL — Visor del funcionamiento interno de Oracle SQL, con el schema HR adaptado a español chileno.">
  <title>Code4SQL — Visor interno de Oracle SQL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Barra de progreso (pasos de la lección actual), estilo stories -->
  <div id="progreso" class="progreso" aria-hidden="true"></div>

  <!-- Puntos para saltar entre lecciones -->
  <div id="dots" class="dots" role="tablist" aria-label="Lecciones"></div>

  <!-- Contenedor de reels -->
  <main id="reels" class="reels" aria-live="off"></main>

  <!-- Controles de reproducción -->
  <nav class="controles" aria-label="Controles">
    <button id="prev" class="btn btn-icon" aria-label="Paso anterior" title="Paso anterior (←)">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button id="play" class="btn btn-icon btn-icon--play" aria-label="Reproducir" title="Reproducir/Pausar (espacio)">
      <i class="bi bi-play-fill"></i>
    </button>
    <button id="next" class="btn btn-icon" aria-label="Paso siguiente" title="Paso siguiente (→)">
      <i class="bi bi-chevron-right"></i>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
